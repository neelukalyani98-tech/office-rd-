<!DOCTYPE html><html lang="hi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>RD App - Mehsana</title>
<style>*{box-sizing:border-box;font-family:Arial,sans-serif}body{margin:0;background:#f1f5f9;padding:10px}.tabs{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}.tabs button{flex:1;padding:12px 5px;border:0;border-radius:10px;font-weight:700;font-size:13px;cursor:pointer;background:#e2e8f0}.tabs button.active{background:#1e40af;color:#fff}.card{background:#fff;padding:14px;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.08)}label{display:block;font-weight:700;font-size:13px;color:#334155;margin:12px 0 5px}input,select{width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:8px;font-size:15px}.row{display:flex;gap:10px}.row>div{flex:1}.btn{width:100%;background:#1e40af;color:#fff;border:0;padding:13px;border-radius:10px;font-weight:800;font-size:16px;margin-top:16px;cursor:pointer}.btn2{flex:1;padding:10px;border:0;border-radius:8px;font-weight:700;color:#fff;cursor:pointer;font-size:13px}.btnWA{width:100%;background:#25D366;color:#fff;border:0;padding:13px;border-radius:10px;font-weight:800;font-size:15px;margin-top:10px;cursor:pointer}.cust{border:1px solid #e2e8f0;padding:12px;border-radius:10px;margin-top:10px}.small{font-size:12px;color:#64748b}.badge{display:inline-block;padding:3px 8px;border-radius:20px;font-size:11px;font-weight:700}.red{background:#fee2e2;color:#b91c1c}.green{background:#dcfce7;color:#166534}.orange{background:#ffedd5;color:#9a3412}.del{color:red;background:none;border:0;float:right;font-weight:700}.edit{color:#1e40af;background:none;border:0;float:right;font-weight:800;margin-right:8px}.suggest{border:1px solid #cbd5e1;border-radius:8px;max-height:220px;overflow:auto;display:none;background:#fff}.suggest div{padding:11px;border-bottom:1px solid #f1f5f9;cursor:pointer}.selected{background:#dcfce7;padding:10px;border-radius:8px;font-weight:700;font-size:14px;margin-top:8px;display:none}.backupBox{background:#fffbeb;border:1px solid #fde68a;padding:10px;border-radius:10px;margin-bottom:12px}table{width:100%;border-collapse:collapse;margin-top:10px;font-size:13px}td,th{padding:8px;border-bottom:1px solid #eee;text-align:left}.checkRow{display:flex;align-items:center;gap:8px;margin-top:12px;background:#f0fdf4;padding:10px;border-radius:8px}.checkRow input{width:20px;height:20px}.statBox{flex:1;padding:10px;border-radius:10px;text-align:center}.mBox{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}.mBox label{margin:0;background:#f1f5f9;border:1px solid #cbd5e1;border-radius:8px;padding:10px 12px;font-size:13px;display:flex;align-items:center;gap:6px;cursor:pointer}.mBox label:has(input:checked){background:#dcfce7;border-color:#16a34a}.mBox input{width:18px;height:18px;margin:0}.famBox{border:2px solid #1e40af;border-radius:12px;padding:12px;margin-top:12px;background:#eff6ff}.famHead{font-weight:800;font-size:16px;color:#1e40af}.instBox{background:#dcfce7;border:1px solid #16a34a;border-radius:8px;padding:8px 10px;margin-top:8px;font-weight:800;font-size:14px;color:#166534;text-align:center}.dueBox{background:#fee2e2;border:1px solid #ef4444;border-radius:8px;padding:8px 10px;margin-top:8px;font-size:13px;font-weight:700;color:#991b1b}.editMode{background:#fef3c7;border:2px solid #f59e0b;padding:10px;border-radius:10px;text-align:center;font-weight:800;color:#92400e;display:none;margin-top:12px}</style></head><body>
<div class="backupBox"><b>🛡️ Data Backup - Roz Ek Baar Zaroor Karna</b><div style="display:flex;gap:8px;margin-top:8px"><button class="btn2" style="background:#16a34a" onclick="exportData()">⬇️ Backup Download</button><button class="btn2" style="background:#f59e0b" onclick="document.getElementById('importFile').click()">⬆️ Backup Wapas Lao</button><input type="file" id="importFile" style="display:none" accept=".json" onchange="importData(event)"></div></div>
<div class="tabs"><button id="t1" class="active" onclick="showTab(1)">+ Add Customer</button><button id="t2" onclick="showTab(2)">₹ Jama Karo</button><button id="t3" onclick="showTab(3)">📄 Report</button><button id="t4" onclick="showTab(4)">⚠️ Baki Wale</button><button id="t5" onclick="showTab(5)">👨‍👩‍👧‍👦 Family Group</button></div>
<div id="tab1" class="card"><div id="editBanner" class="editMode">✏️ EDIT MODE ON HAI - <span id="editName"></span> ka data badal rahe ho <br><button onclick="cancelEdit()" style="margin-top:6px;padding:6px 12px;border:0;border-radius:6px;background:#ef4444;color:#fff;font-weight:700">Cancel Karo</button></div><label>Family / Group Naam * - Jaise Pandya Family, Patel Family</label><input id="f_family" placeholder="Ex: Pandya Family"><label>Naam *</label><input id="f_name" placeholder="Jayeshkumar N Pandya"><label>Account No *</label><input id="f_ac" placeholder="020069003243"><label>CIF No</label><input id="f_cif" placeholder="Ex: 987654"><label>Aslaas Card No.</label><input id="f_aadhaar" placeholder="Ex: Aslaas Card No. likho"><label>Mobile Number *</label><input id="f_mob" type="tel" placeholder="99796xxxxx"><label>Address</label><input id="f_addr" placeholder="Gaam nu naam"><div class="row"><div><label>Monthly RD *</label><input id="f_amt" type="number" placeholder="2000"></div><div><label>Start Date / Account Open Date *</label><input id="f_start" type="date"></div></div><label>Due Date *</label><input id="f_due" type="number" placeholder="Ex: 17" min="1" max="31"><button class="btn" id="saveBtn" onclick="addCustomer()">Customer Save Karo</button><label>Customer List Me Khojo</label><input id="c_search" placeholder="Naam, Family, Account ya Aslaas se khojo..." oninput="render()"><div id="list"></div></div>
<div id="tab2" class="card" style="display:none"><label>Customer Khojo - Naam Ya Account No Likho 🔍</label><input id="j_search" placeholder="Ex: Jitaben ya 0200..." oninput="filterCust()" autocomplete="off"><div id="j_suggest" class="suggest"></div><div id="j_selected" class="selected"></div><label>Kitna Jama Karna Hai? ₹ (1 Mahine Ka)</label><input id="j_amt" type="number" placeholder="2000"><label>Saal Chuno - 2015 Se 2050 Tak</label><select id="j_year"></select><label>Mahine Tick Karo - Jitne Chahiye Utne ✅</label><div class="mBox"><label><input type="checkbox" class="mcheck" value="01"> Jan</label><label><input type="checkbox" class="mcheck" value="02"> Feb</label><label><input type="checkbox" class="mcheck" value="03"> Mar</label><label><input type="checkbox" class="mcheck" value="04"> Apr</label><label><input type="checkbox" class="mcheck" value="05"> May</label><label><input type="checkbox" class="mcheck" value="06"> Jun</label><label><input type="checkbox" class="mcheck" value="07"> Jul</label><label><input type="checkbox" class="mcheck" value="08"> Aug</label><label><input type="checkbox" class="mcheck" value="09"> Sep</label><label><input type="checkbox" class="mcheck" value="10"> Oct</label><label><input type="checkbox" class="mcheck" value="11"> Nov</label><label><input type="checkbox" class="mcheck" value="12"> Dec</label></div><div style="display:flex;gap:8px;margin-top:8px"><button class="btn2" style="background:#16a34a" onclick="tickAllMonths()">Sab Tick Karo</button><button class="btn2" style="background:#64748b" onclick="clearMonths()">Sab Hatavo</button></div><label>Cash / Cheque ?</label><select id="j_type" onchange="document.getElementById('j_check').style.display=this.value=='Cheque'?'block':'none'"><option value="Cash">Cash</option><option value="Cheque">Cheque</option></select><input id="j_check" placeholder="Cheque No. lakho" style="display:none;margin-top:8px"><div class="checkRow"><input type="checkbox" id="wa_check" checked><span>✅ Jama ke baad Customer ko WhatsApp Msg bhejo</span></div><button class="btn" onclick="addJama()">Jama Save Karo</button><div id="j_list"></div></div>
<div id="tab3" class="card" style="display:none"><h3 style="margin:0">📄 Account No. Likho - Pura Hisab Dikhega</h3><label>Account No. Ya Naam Likho</label><input id="r_search" placeholder="Ex: 020069003243" oninput="showReport()"><label>Saal Chuno</label><select id="r_year" onchange="showReport()"></select><div id="reportBox"></div></div>
<div id="tab4" class="card" style="display:none"><h3 style="margin:0">Is Mahine Baki Wale + Pura Baki List</h3><label>Yaha Bhi Khojo</label><input id="b_search" placeholder="Naam / Family se khojo..." oninput="render()"><div id="baki_list"></div></div>
<div id="tab5" class="card" style="display:none"><h3 style="margin:0">👨‍👩‍👧‍👦 Family Group - Sab Family Alag Alag</h3><label>Family Khojo</label><input id="fam_search" placeholder="Ex: Pandya Family..." oninput="render()"><div id="fam_list"></div></div><script>
let customers=JSON.parse(localStorage.getItem('rd_cust')||'[]');let jama=JSON.parse(localStorage.getItem('rd_jama')||'[]');let selectedId=null,lastJama=null,editId=null;
(function(){let jy=document.getElementById('j_year');let ry=document.getElementById('r_year');let opt='';for(let y=2015;y<=2050;y++){opt+=`<option value="${y}" ${y==2026?'selected':''}>${y}</option>`;}jy.innerHTML=opt;ry.innerHTML=`<option value="all">Pura Hisab - Sab Saal (2015-2050)</option>`+opt;})();
customers.forEach(c=>{if(!c.id)c.id=Date.now().toString()+Math.floor(Math.random()*999);if(!c.family)c.family='Single Family';if(!c.aadhaar)c.aadhaar='';});
jama.forEach(j=>{if(!j.id)j.id=Date.now().toString()+Math.floor(Math.random()*99999);if(j.cust!==undefined&&!j.custId){let cu=customers[j.cust];if(cu)j.custId=cu.id;}});
function save(){localStorage.setItem('rd_cust',JSON.stringify(customers));localStorage.setItem('rd_jama',JSON.stringify(jama));render();}
function showTab(n){[1,2,3,4,5].forEach(i=>{document.getElementById('tab'+i).style.display=n==i?'block':'none';document.getElementById('t'+i).className=n==i?'active':''});render();if(n==3)showReport();}
function getBakiMonths(c){if(!c.start)return [];let paid=new Set(jama.filter(j=>j.custId==c.id).map(j=>j.month));let start=c.start.slice(0,7);let now=new Date();let cur=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0');let res=[];let y=parseInt(start.slice(0,4)),m=parseInt(start.slice(5,7));let ey=parseInt(cur.slice(0,4)),em=parseInt(cur.slice(5,7));while(y<ey||(y==ey&&m<=em)){let mm=y+'-'+String(m).padStart(2,'0');if(!paid.has(mm))res.push(mm);m++;if(m>12){m=1;y++;}if(res.length>120)break;}return res;}
function getBakiText(c){let b=getBakiMonths(c);if(!b.length)return '<span style="color:#166534">✅ Koi Baki Nahi - Sab Jama Hai</span>';return '⚠️ Baki Mahine ('+b.length+'): '+b.join(', ')+' &nbsp; | &nbsp; Baki Amount: ₹'+(b.length*c.amt);}
function uid(){return Date.now().toString()+Math.floor(Math.random()*1000);}
function tickAllMonths(){document.querySelectorAll('.mcheck').forEach(c=>c.checked=true);}
function clearMonths(){document.querySelectorAll('.mcheck').forEach(c=>c.checked=false);}
function editCust(id){let c=customers.find(x=>x.id==id);if(!c)return;editId=id;document.getElementById('f_family').value=c.family||'';document.getElementById('f_name').value=c.name||'';document.getElementById('f_ac').value=c.ac||'';document.getElementById('f_cif').value=c.cif||'';document.getElementById('f_aadhaar').value=c.aadhaar||'';document.getElementById('f_mob').value=c.mob||'';document.getElementById('f_addr').value=c.addr||'';document.getElementById('f_amt').value=c.amt||'';document.getElementById('f_start').value=c.start||'';document.getElementById('f_due').value=c.due||'';document.getElementById('editBanner').style.display='block';document.getElementById('editName').textContent=c.name;document.getElementById('saveBtn').textContent='✅ Update Karo - Save Karo';document.getElementById('saveBtn').style.background='#f59e0b';showTab(1);window.scrollTo(0,0);alert('Edit Mode On - '+c.name+' ka Aslaas / Account No / Open Date ab badal sakte ho. Jama wala hisab same rahega.');}
function cancelEdit(){editId=null;document.getElementById('editBanner').style.display='none';document.getElementById('saveBtn').textContent='Customer Save Karo';document.getElementById('saveBtn').style.background='#1e40af';['f_family','f_name','f_ac','f_cif','f_aadhaar','f_mob','f_addr','f_amt','f_start','f_due'].forEach(id=>document.getElementById(id).value='');}
function addCustomer(){let data={family:document.getElementById('f_family').value.trim()||'Single Family',name:document.getElementById('f_name').value.trim(),ac:document.getElementById('f_ac').value.trim(),cif:document.getElementById('f_cif').value.trim(),aadhaar:document.getElementById('f_aadhaar').value.trim(),mob:document.getElementById('f_mob').value.trim(),addr:document.getElementById('f_addr').value.trim(),amt:+document.getElementById('f_amt').value,start:document.getElementById('f_start').value,due:document.getElementById('f_due').value};if(!data.name||!data.ac||!data.amt||!data.start||!data.due){alert('Naam, Account, Amount, Start Date aur Due Date sab bharo!');return;}if(editId){let idx=customers.findIndex(x=>x.id==editId);if(idx>=0){customers[idx]={...customers[idx],...data};save();alert('Ho Gaya! '+data.name+' ka Aslaas / Account No Update Ho Gaya. Jama wala hisab same hai.');cancelEdit();return;}}let c={id:uid(),...data};customers.push(c);save();alert('Ho Gaya! '+c.name+' - '+c.family+' me Save Ho Gaya.');['f_name','f_ac','f_cif','f_aadhaar','f_mob','f_addr','f_amt','f_start','f_due'].forEach(id=>document.getElementById(id).value='');}
function filterCust(){let q=document.getElementById('j_search').value.toLowerCase().trim();let box=document.getElementById('j_suggest');if(!q){box.style.display='none';return;}let f=customers.filter(c=>c.name.toLowerCase().includes(q)||c.ac.includes(q)||(c.family||'').toLowerCase().includes(q)||(c.aadhaar||'').includes(q));if(!f.length){box.innerHTML='<div>Koi naam nahi mila</div>';box.style.display='block';return;}box.innerHTML=f.map(c=>{let cnt=jama.filter(j=>j.custId==c.id).length;let baki=getBakiMonths(c).length;return `<div onclick="selectCust('${c.id}')"><b>${c.name}</b><br><span class="small">👨‍👩‍👧‍👦 ${c.family} | A/c: ${c.ac} | Aslaas: ${c.aadhaar||'-'} | RD: ₹${c.amt} | Start: ${c.start||''} | Installment Hua: ${cnt} | Baki: ${baki} Mahine</span></div>`;}).join('');box.style.display='block';}
function selectCust(id){selectedId=id;let c=customers.find(x=>x.id==id);let cnt=jama.filter(j=>j.custId==id).length;let tot=jama.filter(j=>j.custId==id).reduce((s,j)=>s+j.amt,0);document.getElementById('j_search').value=c.name;document.getElementById('j_suggest').style.display='none';let sel=document.getElementById('j_selected');sel.style.display='block';sel.innerHTML='✅ Chuna Gaya: '+c.name+' ('+c.family+') - A/c: '+c.ac+' | Aslaas: '+(c.aadhaar||'-')+' | RD: ₹'+c.amt+' | Start: '+c.start+'<br>📦 Installment Hua: '+cnt+' | Total Jama: ₹'+tot+'<br>'+getBakiText(c);document.getElementById('j_amt').value=c.amt;}
function addJama(){let amt=+document.getElementById('j_amt').value;let year=document.getElementById('j_year').value;let type=document.getElementById('j_type').value;let check=document.getElementById('j_check').value;if(!selectedId){alert('Pehle customer chuno');return;}if(!amt){alert('Amount likho');return;}let ticked=[...document.querySelectorAll('.mcheck:checked')].map(c=>c.value);if(ticked.length==0){alert('Kam se kam 1 mahina tick karo!');return;}if(type=='Cheque'&&!check){alert('Cheque No. likho bhai!');return;}let c=customers.find(x=>x.id==selectedId);let todayStr=new Date().toLocaleDateString('en-GB');let monthsList=[];let skipped=[];ticked.forEach(m=>{let mm=year+'-'+m;let already=jama.some(j=>j.custId==selectedId&&j.month==mm);if(already){skipped.push(mm);return;}jama.push({id:uid()+Math.floor(Math.random()*999),custId:selectedId,amt,month:mm,date:todayStr,type,check});monthsList.push(mm);});if(monthsList.length==0){alert('Ye sab mahine pehle se jama hai');return;}lastJama={cust:c,amt:amt*monthsList.length,month:monthsList.join(', '),date:todayStr,type,check};save();let msg=monthsList.length+' Mahine ka Jama Ho Gaya! Total: ₹'+(amt*monthsList.length)+' - '+monthsList.join(', ');if(skipped.length)msg+='\nYe pehle se jama the, skip kiye: '+skipped.join(', ');alert(msg);if(document.getElementById('wa_check').checked&&c.mob&&c.mob.length>=10){sendLastWhatsApp();}document.getElementById('j_search').value='';document.getElementById('j_selected').style.display='none';document.getElementById('j_check').value='';clearMonths();selectedId=null;}
function sendLastWhatsApp(){if(!lastJama)return;let c=lastJama.cust;let mob=c.mob.replace(/[^0-9]/g,'');if(mob.length==10)mob='91'+mob;if(mob.startsWith('0'))mob='91'+mob.slice(1);let cnt=jama.filter(j=>j.custId==c.id).length;let msg=`Namaste ${c.name} 🙏\n\nAapka RD paisa receive ho gaya hai.\n\n✅ Total Amount: Rs. ${lastJama.amt}\n📅 Date: ${lastJama.date}\n📅 Mahina: ${lastJama.month}\n💵 Type: ${lastJama.type} ${lastJama.check?'(Cheque No: '+lastJama.check+')':''}\n🏦 Account: ${c.ac}\n📦 Total Installment Hua: ${cnt}\n\nDhanyavaad!`;window.open(`https://wa.me/${mob}?text=${encodeURIComponent(msg)}`,'_blank');}
function delJama(id){let j=jama.find(x=>x.id==id);if(!j){alert('Nahi mila');return;}let cu=customers.find(c=>c.id==j.custId);if(confirm('Pakka Delete karna hai?\n'+(cu?cu.name:'')+' - '+j.month+' - ₹'+j.amt+'\nYe wapas Baki me aa jayega.')){jama=jama.filter(x=>x.id!=id);save();showReport();alert('Delete Ho Gaya! Ab wo mahina fir se Baki me dikhega.');}}
function showReport(){let q=document.getElementById('r_search').value.toLowerCase().trim();let year=document.getElementById('r_year').value;let box=document.getElementById('reportBox');if(!q){box.innerHTML='';return;}let c=customers.find(x=>x.ac.toLowerCase().includes(q)||x.name.toLowerCase().includes(q)||(x.aadhaar||'').toLowerCase().includes(q));if(!c){box.innerHTML='<p style="color:red">❌ Account nahi mila</p>';return;}let list=jama.filter(j=>j.custId==c.id);if(year!=='all')list=list.filter(j=>j.month.startsWith(year));list=list.sort((a,b)=>a.month.localeCompare(b.month));let total=list.reduce((s,j)=>s+j.amt,0);let cashList=list.filter(j=>j.type=='Cash');let chequeList=list.filter(j=>j.type=='Cheque'||j.type=='Check');let cashTotal=cashList.reduce((s,j)=>s+j.amt,0);let chequeTotal=chequeList.reduce((s,j)=>s+j.amt,0);let rows=list.map(j=>`<tr><td>${j.date}</td><td>${j.month}</td><td>₹${j.amt}</td><td><span class="badge ${j.type=='Cash'?'green':'orange'}">${j.type=='Check'?'CHEQUE':j.type.toUpperCase()} ${j.check?'- '+j.check:''}</span></td><td><button onclick="delJama('${j.id}')" style="background:#ef4444;color:#fff;border:0;padding:5px 8px;border-radius:6px;font-weight:700">❌ Delete</button></td></tr>`).join('')||'<tr><td colspan="5">Abhi koi Jama nahi</td></tr>';box.innerHTML=`<hr><b>${c.name} - ${c.family}</b> <button onclick="editCust('${c.id}')" style="background:#1e40af;color:#fff;border:0;padding:6px 12px;border-radius:6px;font-weight:700;margin-left:6px">✏️ Edit Account</button><br><span class="small">A/c: ${c.ac} | CIF: ${c.cif||'-'} | Aslaas: ${c.aadhaar||'-'} | Mob: ${c.mob||'-'}<br>RD: ₹${c.amt} | Start: ${c.start} | Due: ${c.due} Tarikh | Address: ${c.addr||'-'}</span><div class="instBox">📦 KITNA INSTALLMENT HUA: ${list.length} &nbsp; | &nbsp; TOTAL JAMA: ₹${total}</div><div class="dueBox">${getBakiText(c)}</div><div style="display:flex;gap:8px;margin-top:10px"><div class="statBox" style="background:#dcfce7"><b style="color:#166534">💵 CASH</b><br><b>₹${cashTotal}</b><br><span class="small">${cashList.length} baar</span></div><div class="statBox" style="background:#ffedd5"><b style="color:#9a3412">🏦 CHEQUE</b><br><b>₹${chequeTotal}</b><br><span class="small">${chequeList.length} baar</span></div><div class="statBox" style="background:#dbeafe"><b>TOTAL</b><br><b>₹${total}</b><br><span class="small">${list.length} Entry</span></div></div><table><tr><th>Date</th><th>Mahina</th><th>Amount</th><th>Cash / Cheque</th><th>Galti?</th></tr>${rows}</table><button class="btnWA" onclick="sendReportWA('${c.id}')">📲 Ye Report WhatsApp Pe Bhejo</button>`;}
function sendReportWA(id){let c=customers.find(x=>x.id==id);let list=jama.filter(j=>j.custId==id).sort((a,b)=>a.month.localeCompare(b.month));let total=list.reduce((s,j)=>s+j.amt,0);let cashTotal=list.filter(j=>j.type=='Cash').reduce((s,j)=>s+j.amt,0);let chequeTotal=list.filter(j=>j.type=='Cheque'||j.type=='Check').reduce((s,j)=>s+j.amt,0);let lines=list.map(j=>`${j.date} - ${j.month} - ₹${j.amt} - ${j.type} ${j.check?j.check:''}`).join('\n');let mob=c.mob.replace(/[^0-9]/g,'');if(mob.length==10)mob='91'+mob;let msg=`RD REPORT - ${c.name}\nFamily: ${c.family}\nA/c: ${c.ac}\nAslaas: ${c.aadhaar||'-'}\nStart: ${c.start}\nInstallment Hua: ${list.length}\nBaki: ${getBakiMonths(c).join(', ')}\nCash Total: ₹${cashTotal}\nCheque Total: ₹${chequeTotal}\nTotal Paid: ₹${total}\n\n${lines}\n\nDhanyavaad!`;window.open(`https://wa.me/${mob}?text=${encodeURIComponent(msg)}`,'_blank');}
function delCust(id){if(confirm('Pakka delete karna hai?')){customers=customers.filter(c=>c.id!=id);jama=jama.filter(j=>j.custId!=id);save();}}
function exportData(){let data={customers,jama,date:new Date().toLocaleString()};let blob=new Blob([JSON.stringify(data)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='RD-Backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();alert('Backup Download Ho Gaya!');}
function importData(e){let file=e.target.files[0];if(!file)return;let r=new FileReader();r.onload=function(){try{let d=JSON.parse(r.result);if(d.customers){customers=d.customers;jama=d.jama||[];customers.forEach(c=>{if(!c.family)c.family='Single Family';if(!c.aadhaar)c.aadhaar='';});save();alert('Data Wapas Aa Gaya! Total: '+customers.length);}}catch(err){alert('File kharab hai');}};r.readAsText(file);}
function render(){let cq=(document.getElementById('c_search')?.value||'').toLowerCase();let html='';customers.forEach(c=>{if(cq&&!c.name.toLowerCase().includes(cq)&&!c.ac.includes(cq)&&!(c.family||'').toLowerCase().includes(cq)&&!(c.aadhaar||'').includes(cq))return;let cnt=jama.filter(j=>j.custId==c.id).length;let tot=jama.filter(j=>j.custId==c.id).reduce((s,j)=>s+j.amt,0);html+=`<div class="cust"><button class="del" onclick="delCust('${c.id}')">X</button><button class="edit" onclick="editCust('${c.id}')">✏️ EDIT</button><b>👨‍👩‍👧‍👦 ${c.family}</b><br><b>${c.name}</b><br><span class="small">A/c: ${c.ac} | CIF: ${c.cif||'-'} | Aslaas: ${c.aadhaar||'-'} | Mob: ${c.mob||'-'}<br>RD: ₹${c.amt} | Start: ${c.start} | <b>Due: ${c.due} Tarikh</b></span><div class="instBox">📦 Installment Hua: ${cnt} &nbsp;|&nbsp; Total Jama: ₹${tot}</div><div class="dueBox">${getBakiText(c)}</div></div>`;});document.getElementById('list').innerHTML=html||'<p class="small">Abhi koi customer nahi</p>';let jhtml='';jama.slice().reverse().slice(0,20).forEach(j=>{let cu=customers.find(c=>c.id==j.custId);jhtml+=`<div class="cust"><b>${cu?cu.name:'Deleted'}</b> (${cu?cu.family:''}) - ₹${j.amt} <span class="small">(${j.month} | ${j.date}) - ${j.type||'Cash'} ${j.check||''}</span> <button onclick="delJama('${j.id}')" style="background:#ef4444;color:#fff;border:0;padding:4px 8px;border-radius:6px;float:right">❌</button></div>`;});document.getElementById('j_list').innerHTML=jhtml;let today=new Date();let curMonth=today.getFullYear()+'-'+String(today.getMonth()+1).padStart(2,'0');let bq=(document.getElementById('b_search')?.value||'').toLowerCase();let bhtml='';customers.forEach(c=>{if(bq&&!c.name.toLowerCase().includes(bq)&&!c.ac.includes(bq)&&!(c.family||'').toLowerCase().includes(bq))return;let cnt=jama.filter(j=>j.custId==c.id).length;let paid=jama.some(j=>j.custId==c.id&&j.month==curMonth);let dueDay=parseInt(c.due)||1;let dueDate=new Date(today.getFullYear(),today.getMonth(),dueDay);let status=paid?'<span class="badge green">JAMA HO GAYA</span>':(today>dueDate?'<span class="badge red">BAKI - DUE NIKAL GAYA</span>':'<span class="badge orange">BAKI</span>');bhtml+=`<div class="cust"><b>${c.name}</b> (${c.family}) - ₹${c.amt}<br><span class="small">Start: ${c.start} | Due: ${dueDay} Tarikh | ${status}</span><div class="instBox">📦 Installment Hua: ${cnt}</div><div class="dueBox">${getBakiText(c)}</div><br><button class="btn" style="padding:8px;font-size:13px;margin-top:8px" onclick="showTab(2);selectCust('${c.id}')">Iska Jama Karo</button></div>`;});document.getElementById('baki_list').innerHTML=bhtml||'<p>Abhi koi customer nahi</p>';let fq=(document.getElementById('fam_search')?.value||'').toLowerCase();let groups={};customers.forEach(c=>{let f=c.family||'Single Family';if(!groups[f])groups[f]=[];groups[f].push(c);});let fhtml='';Object.keys(groups).sort().forEach(fam=>{if(fq&&!fam.toLowerCase().includes(fq))return;let members=groups[fam];let famTotalRD=members.reduce((s,c)=>s+c.amt,0);let famJama=members.reduce((s,c)=>s+jama.filter(j=>j.custId==c.id).reduce((a,j)=>a+j.amt,0),0);let famInst=members.reduce((s,c)=>s+jama.filter(j=>j.custId==c.id).length,0);let famBaki=members.filter(c=>!jama.some(j=>j.custId==c.id&&j.month==curMonth)).length;let memHtml=members.map(c=>{let cnt=jama.filter(j=>j.custId==c.id).length;let paid=jama.some(j=>j.custId==c.id&&j.month==curMonth);return `<div style="border-top:1px solid #dbeafe;padding:8px 0;display:flex;justify-content:space-between;align-items:center"><div><b>${c.name}</b><br><span class="small">A/c: ${c.ac} | Aslaas: ${c.aadhaar||'-'} | RD: ₹${c.amt} | Start: ${c.start} | Due: ${c.due}<br><b style="color:#166534">📦 Installment: ${cnt}</b><br><span style="color:#991b1b;font-weight:700">${getBakiText(c)}</span></span></div><div>${paid?'<span class="badge green">JAMA</span>':'<span class="badge red">BAKI</span>'}<br><button class="btn" style="padding:5px 10px;font-size:11px;margin-top:4px" onclick="showTab(2);selectCust('${c.id}')">Jama</button> <button class="btn" style="padding:5px 10px;font-size:11px;margin-top:4px;background:#f59e0b" onclick="editCust('${c.id}')">✏️ Edit</button></div></div>`;}).join('');fhtml+=`<div class="famBox"><div class="famHead">👨‍👩‍👧‍👦 ${fam} - ${members.length} Account</div><div class="small" style="margin:6px 0">Total RD / Mahina: <b>₹${famTotalRD}</b> | Total Jama: <b>₹${famJama}</b> | Total Installment: <b>${famInst}</b> | Is Mahine Baki: <b style="color:red">${famBaki} account</b></div>${memHtml}</div>`;});document.getElementById('fam_list').innerHTML=fhtml||'<p>Abhi koi family nahi</p>';}
render();
</script></body></html>
